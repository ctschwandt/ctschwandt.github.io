<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head-tags-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var preference = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script id="page-data" type="application/json"><!--page-data--></script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
