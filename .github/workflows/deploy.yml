name: Validate and deploy portfolio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate static output
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate content
        run: npm run check:content
      - name: Typecheck, build, and validate all generated routes
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Check browser behavior and accessibility
        run: npm run test:browser
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publication is deliberately manual until the owner approves deployment.
  # Pushes and pull requests above only validate the site. Protect the
  # github-pages environment with a required reviewer before the first run.
  deploy:
    name: Deploy approved manual build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
